# name 可以自定义
name: Deploy GitHub Pages

# 触发条件：在 push 到 origin/master 分支后
on:
  workflow_dispatch:
  push:
    branches:
      - master

# 任务
jobs:
  build-and-deploy:
    # 服务器环境：最新版 Ubuntu
    runs-on: ubuntu-latest
    steps:
      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false
      
      # 设置nodejs环境不设置nodejs18以上会报错
      - name: NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 20
      # - run: npm ci
      # - run: npm test

      # 生成静态文件
      - name: Build
        run: npm install && npm run docs:build

       # 部署到gh-pages分支的h5目录
      - name: Deploy
        uses: s0/git-publish-subdir-action@develop
        env:
            REPO: self
            BRANCH: gh-pages
            FOLDER: .vitepress/dist
            GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
            TARGET_DIR: ./
